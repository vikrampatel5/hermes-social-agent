[project]
name = "hermes-social-agent"
version = "0.1.0"
description = "Autonomous social engagement & customer acquisition agent for stockscribe.in"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3",
    "youtube-transcript-api>=0.6,<0.7",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "fastapi>=0.104,<1",
    "pydantic>=2.5,<3",
    "google-api-python-client>=2.120,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
